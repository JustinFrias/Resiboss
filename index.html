<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/resiboss-emblem.png" />
    <link rel="apple-touch-icon" href="/resiboss-emblem.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('resiboss_theme_v2') || 'light';
          document.documentElement.setAttribute('data-theme', saved);
        } catch (e) {}
      })();
    </script>
    
    <!-- Android Chrome & PWA Mobile Capabilities -->
    <meta name="theme-color" content="#f8fafc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Resiboss" />
    <meta name="application-name" content="Resiboss" />
    <meta name="format-detection" content="telephone=no" />

    <meta name="description" content="Resiboss - Next-generation 3D Liquid Glass Receipt Scanner & Financial Document Intelligence with automated OCR, analytics, multi-currency and multi-language support." />
    <title>Resiboss | 3D Liquid Glass Receipt Scanner & Financial Intelligence</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <script>
      // Native Android APK OAuth Deep Link Forwarder:
      // If external Chrome tab receives Google OAuth callback, bounce immediately into Resiboss APK!
      (function() {
        try {
          var h = window.location.hash || '';
          var s = window.location.search || '';
          if (h.includes('access_token=') || s.includes('code=')) {
            var isNative = Boolean(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
            if (!isNative && /Android/i.test(navigator.userAgent)) {
              window.location.replace('com.resiboss.app://auth/callback' + s + h);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
