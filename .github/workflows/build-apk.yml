name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: npm install --include=dev

      - name: Build Web App
        run: |
          npm run build
          ls -la dist/

      - name: Ensure Android Assets Directory
        run: |
          mkdir -p android/app/src/main/assets

      - name: Sync Capacitor to Android
        run: npx --yes cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Resiboss.apk
          cd app/build/outputs/apk/debug
          zip Resiboss-APK.zip Resiboss.apk

      - name: Upload Debug APK Artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: Resiboss-Debug-APK
          path: android/app/build/outputs/apk/debug/Resiboss.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Resiboss Android App (Latest APK & ZIP)"
          body: "Download Resiboss APK in .apk or .zip format."
          files: |
            android/app/build/outputs/apk/debug/Resiboss.apk
            android/app/build/outputs/apk/debug/Resiboss-APK.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

