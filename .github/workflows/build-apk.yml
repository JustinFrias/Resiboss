name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: npm install --include=dev

      - name: Build Web App
        run: |
          npm run build
          ls -la dist/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_APP_ENV: production

      - name: Ensure Android Assets Directory
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor to Android
        run: npx --yes cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: Generate Release Keystore (if not present)
        run: |
          if [ ! -f android/app/resiboss-release.jks ]; then
            echo "Keystore not found, generating..."
            keytool -genkeypair -v \
              -keystore android/app/resiboss-release.jks \
              -alias resiboss \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass resiboss2026 \
              -keypass resiboss2026 \
              -dname "CN=Resiboss, OU=Finance, O=Resiboss, L=Manila, ST=NCR, C=PH"
          else
            echo "Keystore already exists, skipping generation."
          fi

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Package APK
        id: package
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Resiboss.apk
            cd android/app/build/outputs/apk/release
            zip Resiboss-APK.zip Resiboss.apk
            echo "OUTPUT_DIR=android/app/build/outputs/apk/release" >> $GITHUB_ENV
            echo "APK_TYPE=release" >> $GITHUB_OUTPUT
          else
            echo "Release APK not found, falling back to debug."
            cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Resiboss.apk
            cd android/app/build/outputs/apk/debug
            zip Resiboss-APK.zip Resiboss.apk
            echo "OUTPUT_DIR=android/app/build/outputs/apk/debug" >> $GITHUB_ENV
            echo "APK_TYPE=debug" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resiboss-Android-APK
          path: ${{ env.OUTPUT_DIR }}/Resiboss.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Resiboss Android App (Latest Release APK)"
          body: "Download the official Resiboss APK in .apk or .zip format."
          make_latest: true
          prerelease: false
          files: |
            ${{ env.OUTPUT_DIR }}/Resiboss.apk
            ${{ env.OUTPUT_DIR }}/Resiboss-APK.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
